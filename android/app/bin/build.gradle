plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.shibleyapps.bible"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // ENABLE CORE LIBRARY DESUGARING FOR JAVA 8+ FEATURES
        coreLibraryDesugaringEnabled true
        
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId = "com.shibleyapps.bible"
        minSdkVersion 24
        targetSdkVersion flutter.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    dependencies {
        // UPDATED TO VERSION 2.1.4 AS REQUIRED BY FLUTTER LOCAL NOTIFICATIONS
        coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            
            // 🎯 BOTH SET TO FALSE TO BYPASS THE KOTLIN METADATA COMPILER CRASH
            minifyEnabled false
            shrinkResources false
            
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}